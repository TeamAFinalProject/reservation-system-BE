spring:
  data:
    redis:
      host: ${VALKEY_HOST}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      ssl:
        enabled: ${VALKEY_TLS:true}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none # 운영에서는 자동 스키마 변경에 의존하지 않음
