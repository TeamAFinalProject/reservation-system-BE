spring:
  application:
    name: reservation
  profiles:
    # 환경변수 SPRING_PROFILES_ACTIVE로 덮어쓸 수 있음 (운영: prod)
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  auth:
    idle-timeout: ${AUTH_IDLE_TIMEOUT:30m}
    absolute-timeout: ${AUTH_ABSOLUTE_TIMEOUT:12h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    # Hibernate JDBC exception messages may include values from violated constraints.
    org.hibernate.orm.jdbc.error: OFF
