name: ECR Push

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions: {}

jobs:
  verify-manual:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  push-booking:
    needs: verify-manual
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'workflow_dispatch' && needs.verify-manual.result == 'success') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'develop' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      source-sha: ${{ env.SOURCE_SHA }}
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      ECR_REPOSITORY: teama/booking
      EXPECTED_AWS_ACCOUNT_ID: '109729968560'
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Check repository variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ "$AWS_REGION" != ap-northeast-2 ]]; then
            echo "::error::Set the AWS_REGION repository variable to ap-northeast-2."
            exit 1
          fi
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "::error::Set the AWS_ROLE_ARN repository variable."
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Build Docker image
        run: docker build --platform linux/amd64 --tag "reservation:$IMAGE_TAG" .

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.2.0

      - name: Push Docker image
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          expected_registry="$EXPECTED_AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          if [[ "$ECR_REGISTRY" != "$expected_registry" ]]; then
            echo "::error::The ECR login returned an unexpected registry."
            exit 1
          fi

          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "reservation:$IMAGE_TAG" "$image"
          docker push "$image"

          digest="$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" --query 'images[0].imageId.imageDigest' --output text)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ECR did not return a valid image digest."
            exit 1
          fi
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

  deploy-booking:
    needs: push-booking
    if: ${{ !cancelled() && needs.push-booking.result == 'success' && vars.ECS_DEPLOY_ENABLED == 'true' }}
    environment: ecs-mvp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: teama-booking-mvp-deploy
      cancel-in-progress: false
      queue: max
    env:
      SOURCE_SHA: ${{ needs.push-booking.outputs.source-sha }}
      IMAGE: ${{ needs.push-booking.outputs.image }}
      GH_REPO: ${{ github.repository }}
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: '109729968560'
      ECS_STACK: teama-booking-mvp
    steps:
      - name: Check deployment variables
        env:
          ECS_DEPLOY_ROLE_ARN: ${{ vars.ECS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ "$ECS_DEPLOY_ROLE_ARN" != "arn:aws:iam::$AWS_ACCOUNT_ID:role/"* ]]; then
            echo "::error::Set ECS_DEPLOY_ROLE_ARN to the approved AWS deployment role."
            exit 1
          fi

      - name: Check out verified source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.ECS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Deploy and verify ECS revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-booking.sh
